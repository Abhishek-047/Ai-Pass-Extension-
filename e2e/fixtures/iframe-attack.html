<!DOCTYPE html>
<html>
<head>
  <title>Iframe Attack</title>
</head>
<body>
  <h2>Safe Page</h2>
  <p>This is the trusted origin.</p>
  
  <!-- The iframe would typically load from attacker.com -->

</html>
