<!DOCTYPE html>
<html>
<head>
  <title>Angular Login</title>
</head>
<body>
  <app-root _nghost-c0="" ng-version="12.0.0">
    <form _ngcontent-c0="" class="ng-untouched ng-pristine ng-invalid">
      <h2>Angular Auth</h2>
      <mat-form-field>
        <input matInput name="login" type="text" id="userLogin" />
      </mat-form-field>
      <mat-form-field>
        <input matInput name="pass" type="password" id="userPass" />
      </mat-form-field>
      <button mat-button>Log in</button>
    </form>
  </app-root>
</body>
</html>
