<!DOCTYPE html>
<html>
<head>
  <title>React Login</title>
</head>
<body>
  <div id="root">
    <form id="react-login" data-reactroot="">
      <h2>Sign In</h2>
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="react-input" />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="react-input" />
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
