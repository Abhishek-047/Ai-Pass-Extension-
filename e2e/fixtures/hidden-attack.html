<!DOCTYPE html>
<html>
<head>
  <title>Hidden Field Attack</title>
  <style>
    .hidden-field {
      opacity: 0;
      position: absolute;
      left: -9999px;
    }
    .honeypot {
      display: none;
    }
  </style>
</head>
<body>
  <form>
    <h2>Fake Login</h2>
    <!-- Attacker tries to steal autofill credentials -->
    <input type="text" name="username" class="hidden-field" autocomplete="username" />
    <input type="password" name="password" class="hidden-field" autocomplete="current-password" />
    
    <!-- Visible fields are just dummy -->
    <input type="text" placeholder="Search..." />
    <button>Search</button>

    <!-- Honeypot fields -->
    <input type="text" name="email_honeypot" class="honeypot" />
  </form>
</body>
</html>
